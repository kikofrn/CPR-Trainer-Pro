<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EH Academy — CPR Trainer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Inter', sans-serif;
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        width: 100%;
      }

      /* Logo Styles */
      .logo-container {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .logo-image {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .logo-text {
        display: flex;
        flex-direction: column;
      }
      .text-everyday {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: #f5394e;
        line-height: 1;
        margin-bottom: 4px;
      }
      .text-hero-wrapper {
        display: flex;
        flex-direction: column;
      }
      .text-hero {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.05em;
        color: #fedeca;
      }
      .text-academy {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: rgba(172, 222, 255, 0.7);
        line-height: 1;
        margin-top: 4px;
      }

      /* Content Area */
      .content-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      /* Video Styles */
      .video-container {
        width: 280px; /* Much smaller size in the center */
        border-radius: 16px;
        overflow: hidden;
        background: transparent;
      }
      video {
        width: 100%;
        display: block;
        object-fit: contain;
      }

      /* Progress Bar */
      .progress-container {
        width: 240px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .progress-bar-bg {
        width: 100%;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background-color: #f5394e;
        border-radius: 4px;
      }
      .progress-text {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="logo-container">
        <div class="logo-image">
          <img src="/eha-icon.png" alt="EH Academy" />
        </div>
        <div class="logo-text">
          <div class="text-everyday">EVERYDAY</div>
          <div class="text-hero-wrapper">
            <div class="text-hero">HERO</div>
            <div class="text-academy">ACADEMY</div>
          </div>
        </div>
      </div>
      
      <div class="content-area">
        <div class="video-container">
          <video autoplay loop muted playsinline>
            <source src="/CPR-Dummies.mp4" type="video/mp4" />
          </video>
        </div>
        
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">LOADING 0%</div>
        </div>
      </div>
    </div>

    <script>
      // Animate the progress bar to 100% over exactly 3.5 seconds
      const duration = 3500; 
      const start = performance.now();
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');

      function updateProgress(time) {
        let elapsed = time - start;
        let percentage = Math.min((elapsed / duration) * 100, 100);
        
        progressFill.style.width = percentage + '%';
        progressText.innerText = 'LOADING ' + Math.floor(percentage) + '%';

        if (percentage < 100) {
          requestAnimationFrame(updateProgress);
        } else {
          progressText.innerText = 'READY';
        }
      }

      requestAnimationFrame(updateProgress);
    </script>
  </body>
</html>
