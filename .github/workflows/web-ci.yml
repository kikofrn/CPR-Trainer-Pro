name: Web App CI

on:
  push:
    branches:
      - web-app
  pull_request:
    branches:
      - web-app

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Unit)
        run: npx vitest run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (E2E, default suite)
        run: npx playwright test --config=playwright.config.ts
        env:
          PLAYWRIGHT_ARTIFACT_DIR: ${{ runner.temp }}/playwright-default

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-default-playwright-report
          path: ${{ runner.temp }}/playwright-default/html-report
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-default-playwright-failure-artifacts
          path: ${{ runner.temp }}/playwright-default/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build
