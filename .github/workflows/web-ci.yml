name: Web App CI

on:
  push:
    branches:
      - web-app
  pull_request:
    branches:
      - web-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Unit)
        run: npx vitest run

      - name: Build
        run: npm run build
