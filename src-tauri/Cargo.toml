[package]
name = "cpr-trainer-pro"
version = "2.3.2"
description = "EH Academy CPR Trainer Pro — Instructor Training Application"
authors = ["EH Academy"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
http = "1"
http-range = "0.1"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
tauri-plugin-process = "2"
sysinfo = { version = "0.36.1", default-features = false, features = ["disk"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

